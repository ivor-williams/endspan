name: Build and publish site

# Rebuilds the home page, the report and its PDF, then publishes them to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42

      - name: Unlock PDF fonts (desktop licence, kept encrypted in the repo)
        continue-on-error: true
        env:
          FONTS_KEY: ${{ secrets.FONTS_KEY }}
        run: |
          if [ -n "$FONTS_KEY" ]; then
            printf '%s' "$FONTS_KEY" > /tmp/fontkey
            openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/fontkey -in assets/fonts-pdf.tar.gz.enc | tar xzf - -C assets
            rm /tmp/fontkey
            pip install --quiet fonttools
            python scripts/prepare_pdf_fonts.py assets/fonts-pdf
          else
            echo "::warning::FONTS_KEY not set: the PDF will use fallback fonts"
            exit 1
          fi

      - name: Render site
        run: quarto render

      - name: Check the PDF uses Arizona
        continue-on-error: true
        run: |
          if grep -a -q "ABCArizonaText" _site/report/report.pdf; then echo "PDF fonts OK"; else echo "::warning::PDF is using fallback fonts"; exit 1; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
