project:
  type: website
  output-dir: _site
  resources:
    - assets/fonts/*.woff
    - assets/home.js
    - assets/viz.js
  render:
    - index.qmd
    - report/index.qmd
    - privacy.qmd

website:
  title: "Better Dying Fund"
  site-url: https://betterdying.fund/
  description: "{{< var tagline >}}"
  image: assets/img/og-home.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  search: false
  navbar:
    collapse: false
    title: "{{< var name >}}"
    right:
      - text: Read the report
        href: report/index.qmd
      - text: Stay updated
        href: index.qmd#get-involved
  page-footer:
    center: "[Privacy](/privacy.qmd)"

format:
  html:
    theme: [cosmo, assets/theme.scss]
    css: assets/fonts.css
    include-in-header: assets/analytics.html
    include-after-body: assets/site-scripts.html
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      body-width: 760px
      sidebar-width: 280px
      margin-width: 0px
